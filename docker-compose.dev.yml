version: '3.8'

services:
  # Development MongoDB with persistent data
  mongodb:
    image: mongo:6.0
    container_name: cities-game-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: cities-game-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - cities-game-dev-network

  # Development Redis
  redis:
    image: redis:7-alpine
    container_name: cities-game-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cities-game-dev-network

  # Backend in development mode with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cities-game-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://dev:devpassword@mongodb:27017/cities-game-dev?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/data:/app/data
    networks:
      - cities-game-dev-network
    command: npm run dev

  # Frontend in development mode with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cities-game-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
      VITE_ENABLE_ADMIN_PANEL: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cities-game-dev-network
    command: npm run dev

volumes:
  mongodb_dev_data:
    driver: local

networks:
  cities-game-dev-network:
    driver: bridge